name: Update FV rates
 
on:
  schedule:
    - cron: '17 5 * * *'   # every day 05:17 UTC
  workflow_dispatch: {}
 
permissions:
  contents: write
 
concurrency:
  group: update-rates
  cancel-in-progress: false
 
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies (lockfile, no scripts)
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Scrape rates
        run: npm run scrape
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/rates.json; then
            echo "No rate changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "Update FV rates $(date -u +%Y-%m-%d)"
          git push
 
